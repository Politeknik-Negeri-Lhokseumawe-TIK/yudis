server {
    listen 80;
    server_name yudisium.tik.pnl.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yudisium.tik.pnl.ac.id;

    # SSL Certificates (Let's Encrypt / PNL SSL)
    ssl_certificate /etc/letsencrypt/live/yudisium.tik.pnl.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yudisium.tik.pnl.ac.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/yudisium/build/web;
    index index.html;

    # SPA Rewrites for Flutter Web routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
